# TalkyHub widget CDN — host nginx for cdn.talkyhub.ru.
#
# Serves the static embeddable widget bundle (the CI publishes dist/ under
# /var/www/cdn.talkyhub.ru, so the file lands at /var/www/cdn.talkyhub.ru/widget/v1/loader.js and is served
# at https://cdn.talkyhub.ru/widget/v1/loader.js). Exact server_name; TLS via the *.talkyhub.ru wildcard cert
# (already covers this subdomain). cdn is DNS-only (direct to origin), same as api/app/docs.
#
# Install: copy to /etc/nginx/sites-available/cdn.talkyhub.ru.conf, symlink into sites-enabled/, then
# `nginx -t && systemctl reload nginx`.

# HTTP :80 — ACME http-01 challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.talkyhub.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS :443 — static file server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.talkyhub.ru;

    ssl_certificate     /etc/ssl/talkyhub.ru.pem;
    ssl_certificate_key /etc/ssl/talkyhub.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;

    root /var/www/cdn.talkyhub.ru;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript;

    # Versioned bundle -> immutable, cache hard (a new release bumps /widget/v2/). Loading it via <script> is
    # not CORS-gated; the widget's own API calls to api.talkyhub.ru are CORS-handled server-side. ACAO:* is set
    # anyway so a fetch()/import of the bundle is never blocked.
    location /widget/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = / { return 302 https://talkyhub.ru; }
    location / { return 404; }
}
